# The first workflow in this repo that actually runs the tests. Until it
# existed, CI built container images and nothing else — `npm test` could be
# red for a week and every badge would stay green.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, unit, browser e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npx playwright install chromium --with-deps
      # CI builds and serves the production bundle (see playwright.config.ts).
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Security — dependency & vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The scanner runs on the latest patched Go, not the module's declared
      # floor — a stdlib CVE is fixed by a newer toolchain, and the point of
      # this job is to scan against one that has the fixes.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # govulncheck reports only vulnerabilities the code actually reaches, so a
      # finding here is real, not a transitive advisory nobody can trigger.
      - name: govulncheck (backend)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # High and critical block; transitive noise below that only informs.
      - name: npm audit (frontend)
        run: npm audit --audit-level=high
      # Trivy covers what the two above miss: OS packages and lockfile advisories
      # across both ecosystems. Unfixed vulns don't fail the build — there is
      # nothing to do about them yet — but a fixable high/critical does.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  backend:
    name: Backend — vet, unit, API e2e against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wit
          POSTGRES_PASSWORD: wit
          POSTGRES_DB: wit_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      # The e2e suite creates a throwaway schema per test, so one database
      # serves the whole run and is left empty afterwards.
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://wit:wit@localhost:5432/wit_ci?sslmode=disable
