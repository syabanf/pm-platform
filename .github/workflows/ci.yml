# The first workflow in this repo that actually runs the tests. Until it
# existed, CI built container images and nothing else — `npm test` could be
# red for a week and every badge would stay green.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, unit, browser e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npx playwright install chromium --with-deps
      # CI builds and serves the production bundle (see playwright.config.ts).
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backend:
    name: Backend — vet, unit, API e2e against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wit
          POSTGRES_PASSWORD: wit
          POSTGRES_DB: wit_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      # The e2e suite creates a throwaway schema per test, so one database
      # serves the whole run and is left empty afterwards.
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://wit:wit@localhost:5432/wit_ci?sslmode=disable
