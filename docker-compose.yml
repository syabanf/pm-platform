services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8080
    ports:
      - "${APP_PORT:-8081}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
      - private
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8080"
      DATABASE_URL: postgres://${DB_USER:-wit}:${DB_PASSWORD:-wit}@db:5432/${DB_NAME:-wit_sprint_os}?sslmode=disable
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      # Tunables. Defaults match internal/config/config.go, so a variable left
      # unset in .env behaves exactly as the binary would on its own.
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15s}
      STATEMENT_TIMEOUT: ${STATEMENT_TIMEOUT:-5s}
      DELETE_TIMEOUT: ${DELETE_TIMEOUT:-120s}
      LOCK_TIMEOUT: ${LOCK_TIMEOUT:-250ms}
      READ_TIMEOUT: ${READ_TIMEOUT:-10s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-20s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      MAX_DB_CONNS: ${MAX_DB_CONNS:-25}
      MIN_DB_CONNS: ${MIN_DB_CONNS:-2}
      MAX_CONN_IDLE_TIME: ${MAX_CONN_IDLE_TIME:-5m}
      MAX_CONN_LIFETIME: ${MAX_CONN_LIFETIME:-60m}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-1M}
      # APP_ENV is production here, so registration will not hand the
      # verification token back in the response. With no mailer it needs
      # somewhere to go, or sign-ups refuse with 503 — see .env.example.
      VERIFICATION_TOKEN_IN_LOG: ${VERIFICATION_TOKEN_IN_LOG:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - private
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/migrate"]
    command:
      - -path=/app/migrations
      - -database=postgres://${DB_USER:-wit}:${DB_PASSWORD:-wit}@db:5432/${DB_NAME:-wit_sprint_os}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    restart: "on-failure:5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-wit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wit}
      POSTGRES_DB: ${DB_NAME:-wit_sprint_os}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - private
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  public:
  private:
    internal: true

volumes:
  postgres_data:
